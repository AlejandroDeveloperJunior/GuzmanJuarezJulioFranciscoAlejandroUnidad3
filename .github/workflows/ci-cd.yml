name: MediConnect Pro CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    name: Backend Typecheck, Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./test-ci.db"
      - run: npm run prisma:seed
        env:
          DATABASE_URL: "file:./test-ci.db"
          ENCRYPTION_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - run: npm run typecheck
      - run: npm test -- --coverage
        env:
          DATABASE_URL: "file:./test-ci.db"
          JWT_ACCESS_SECRET: "ci_access_secret_key"
          JWT_REFRESH_SECRET: "ci_refresh_secret_key"
          CSRF_SECRET: "ci_csrf_secret_key"
          ENCRYPTION_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  frontend-qa:
    name: Frontend Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

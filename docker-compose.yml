version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: mediconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediconnect_dev
      POSTGRES_PASSWORD: SecurePassDev2026!
      POSTGRES_DB: mediconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    container_name: mediconnect_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "RedisDevPass2026!"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
